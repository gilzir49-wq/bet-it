<style>
/* ===== BET-IT – עיצוב: כחול-לילה + ירוק-ליים חשמלי ===== */
:root{
  --bg:#070A14;--bg2:#0A0E1C;--card:#0F1426;--card2:#161C33;--card3:#1F2747;--line:#1C2340;--line2:#232B4D;--line3:#2A3358;
  --txt:#F2F4FA;--txt2:#C9CFE3;--mut:#8E97B5;--mut2:#5A6385;--gold:#C6F432;--gold2:#A8D41E;--accent-hi:#E2FF7A;--on-accent:#0A0F00;--green:#3B2FD9;--em:#3BE38B;--red:#FF5A6A;--red2:#FF8A96;--p:#A97BFF;--p2:#C3A3FF;--warn:#FFC94D;
  --y:var(--gold);--o:var(--gold2);--g:var(--em);--r:var(--red);
  --r-sm:10px;--r-md:14px;--r-lg:20px;--shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;overflow-x:clip;max-width:100vw;background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom));background:radial-gradient(1200px 500px at 80% -100px,rgba(76,64,230,.35),transparent 60%),var(--bg);background-attachment:fixed}
button{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
b,.big,.score,.v,.val{font-variant-numeric:tabular-nums}
/* סרגל עליון */
.appbar{position:sticky;top:0;z-index:20;background:rgba(5,12,8,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{position:relative;height:36px;padding:0 11px;border-radius:12px;letter-spacing:.5px;direction:ltr;font-size:14px !important;white-space:nowrap;background:linear-gradient(145deg,var(--gold),var(--gold2));color:#0A0E1C;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 4px 14px rgba(198,244,50,.25);flex:0 0 auto}
.mark .sep{display:inline;font-size:14px;margin:0 5px;opacity:.45;font-weight:900}
.mark i{position:absolute;bottom:-2px;left:-2px;width:11px;height:11px;border-radius:50%;background:var(--mut);border:2px solid var(--bg)}
.mark i.on{background:var(--em);box-shadow:0 0 8px var(--em)}
.brand b{display:block;font-size:17px;font-weight:900;letter-spacing:.3px;line-height:1}
.brand small{display:block;color:var(--mut);font-size:11px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topr{display:flex;align-items:center;gap:6px}
.bal{position:relative;display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,#1A2140,#11162B);border:1px solid rgba(198,244,50,.55);color:var(--gold);border-radius:99px;padding:6px 12px;font-weight:900;font-size:16px;white-space:nowrap;cursor:pointer;transition:background .3s,border-color .3s}
.bal small{color:var(--mut);font-weight:700;font-size:10.5px}
.bal.lv small{color:#ff8a8d;animation:pulse 1.4s infinite}
.bal.up{background:rgba(52,210,123,.25);border-color:var(--em)}.bal.dn{background:rgba(255,90,95,.25);border-color:var(--red)}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;color:#d4dbf0;cursor:pointer}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut)}.dot.on{background:var(--em)}
.delta{position:fixed;z-index:96;font-weight:900;font-size:22px;pointer-events:none;animation:floatUp 1.8s ease-out forwards;text-shadow:0 2px 10px #000}
.delta.up{color:var(--em)}.delta.dn{color:var(--red)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px)}}
@keyframes pulse{50%{opacity:.45}}
/* טיפוגרפיה */
h2{font-weight:900;font-size:21px;margin:18px 2px 8px;letter-spacing:-.2px}
.muted{color:var(--mut);font-size:13px;line-height:1.45}
.card{background:linear-gradient(180deg,var(--card),#0C1122);border-radius:var(--r-lg);padding:14px;margin:10px 0;border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
/* פרסומת חסות – עדינה */
.ad{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(76,64,230,.35),rgba(76,64,230,.08));border:1px solid var(--line2);border-inline-start:3px solid var(--gold);color:#dde3f4;border-radius:var(--r-md);padding:10px 12px;margin:14px 0;font-weight:700;font-size:13px}
.ad b{color:var(--gold)}
/* צ'יפים */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;scrollbar-width:none;margin:0 -14px;padding-inline:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line2);background:var(--card);color:#d9dff2;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s}
.chip.on{background:var(--gold);color:#0A0E1C;border-color:var(--gold);box-shadow:0 4px 14px rgba(198,244,50,.25)}
.chip .n{opacity:.65;font-size:11px;margin-inline-start:5px}
.lghead{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;margin:18px 4px 6px;color:var(--mut);letter-spacing:.3px;text-transform:uppercase}
.lghead:after{content:"";flex:1;height:1px;background:var(--line)}
/* כרטיס משחק */
.fx{padding:14px 14px 12px}
.fx .top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mut);margin-bottom:10px;font-weight:700}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:900;font-size:14.5px;line-height:1.2}
.tm img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.mid{text-align:center;min-width:70px;display:flex;flex-direction:column;align-items:center;gap:4px}
.score{font-size:30px;font-weight:900;direction:rtl;unicode-bidi:isolate;white-space:nowrap;letter-spacing:1px}
.ko{font-size:18px;font-weight:900;color:var(--txt);background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:4px 10px}
.live{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:900;animation:pulse 1.4s infinite}
.fin{display:inline-block;background:var(--card3);color:#cfd6ee;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:900}
.lock{color:#ffb0b2;font-weight:700}
.odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.ob{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:8px 4px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:manipulation;transition:transform .1s,background .15s,border-color .15s}
.ob .l{font-size:11.5px;color:var(--mut);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.ob .v{font-size:18px;font-weight:900;color:var(--gold)}
.ob:active{transform:scale(.95)}
.ob:hover:not(:disabled){border-color:rgba(198,244,50,.5)}
.ob.mine{background:linear-gradient(180deg,rgba(198,244,50,.22),rgba(198,244,50,.08));border-color:var(--gold)}
.ob:disabled{opacity:.35;cursor:default}
.csb{display:block;width:100%;margin-top:8px;background:transparent;border:1px dashed var(--line2);color:#cfd6ee;border-radius:12px;padding:9px;font-weight:700;font-size:13px;cursor:pointer}
.csb:disabled{opacity:.35}
.mybet{margin-top:8px;padding:8px 11px;border-radius:12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;background:rgba(198,244,50,.07);border:1px solid rgba(198,244,50,.3)}
.mybet.won{background:rgba(52,210,123,.12);border-color:rgba(52,210,123,.6)}.mybet.lost{background:rgba(255,90,95,.1);border-color:rgba(255,90,95,.5)}
.who{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.who summary{cursor:pointer;font-weight:700;font-size:13px;color:#cfd6ee;list-style:none}
.wr{display:flex;justify-content:space-between;font-size:13px;padding:6px 2px;border-bottom:1px solid var(--line)}
.pct{display:inline-block;min-width:44px;text-align:center;border-radius:99px;padding:1px 8px;font-weight:900;background:linear-gradient(90deg,rgba(52,210,123,.35) var(--p),rgba(255,255,255,.08) var(--p));color:#fff}
.st-won{color:var(--em)}.st-lost{color:var(--red)}.st-open{color:var(--mut)}.st-live{color:var(--gold)}
/* גיליון הימור */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:40;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;overflow-x:hidden;z-index:41;background:#121831;border-top:0;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;box-shadow:0 -20px 50px rgba(0,0,0,.6)}
#sheet:before{content:"";display:block;width:40px;height:5px;border-radius:99px;background:var(--line3);margin:0 auto 12px}
#sheet.show{transform:none}#sheetBg.show{display:block}
.pick{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;margin-top:10px}
.pick .t{font-weight:900;font-size:18px}.pick .o{font-size:30px;font-weight:900;color:var(--gold)}
.stake{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.stake input{flex:1;height:56px;font-size:24px;font-weight:900;text-align:center;background:var(--bg);color:var(--txt);border:1.5px solid var(--line3);border-radius:14px;padding:0 16px;font-variant-numeric:tabular-nums;font-family:inherit;width:100%;outline:none}
.stake input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,244,50,.15)}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:14px 0 2px;direction:rtl;--fill:0%}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to left,var(--gold) var(--fill),var(--card3) var(--fill))}
.rng::-moz-range-track{height:8px;border-radius:99px;background:var(--card3)}.rng::-moz-range-progress{height:8px;border-radius:99px;background:var(--gold)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--gold);margin-top:-10px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.rng::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--gold)}
.tray{display:flex;justify-content:space-between;align-items:flex-end;gap:5px;max-width:100%;margin:12px 0 4px;touch-action:none;user-select:none;-webkit-user-select:none}
.chipx{--c:#e9edf5;--t:#0A0E1C;width:clamp(40px,12.5vw,54px);height:clamp(40px,12.5vw,54px);border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--t);cursor:grab;position:relative;
  background:radial-gradient(circle,var(--c) 0 58%,rgba(255,255,255,.9) 59% 61%,var(--c) 62% 100%);box-shadow:0 4px 0 rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.4),inset 0 0 0 3px rgba(0,0,0,.15);transition:transform .12s}
.chipx:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.85) 0 12deg,transparent 12deg 45deg);-webkit-mask:radial-gradient(circle,transparent 0 70%,#000 71%);mask:radial-gradient(circle,transparent 0 70%,#000 71%)}
.chipx:active{transform:translateY(-6px) scale(1.06)}
.chipx.off{opacity:.3;filter:grayscale(1)}
.chipx small{position:relative;z-index:1}
.allin{flex:1;min-width:0;height:clamp(40px,12.5vw,54px);padding:0 4px;border-radius:14px;border:1px solid rgba(198,244,50,.6);background:var(--card2);color:var(--gold);font-weight:900;font-size:13px;cursor:pointer}
.pot{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-height:84px;background:radial-gradient(ellipse at center,rgba(59,227,139,.12),transparent 70%),rgba(0,0,0,.3);border:1px dashed var(--line2);border-radius:18px;margin-top:12px;padding:8px}
.pot .amt{font-size:30px;font-weight:900;color:#fff;min-width:70px;text-align:center}
.pot .clr{position:absolute;top:6px;left:8px;background:none;border:0;color:var(--mut);font-weight:700;font-size:12px;cursor:pointer}
.stacks{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;justify-content:center}
.stk{display:flex;flex-direction:column-reverse;align-items:center;position:relative}
.stk i{display:block;width:34px;height:7px;border-radius:50%/60%;margin-top:-3px;background:var(--c);box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(255,255,255,.55),0 0 0 1px rgba(255,255,255,.18)}
.stk b{font-size:11px;color:var(--mut);margin-top:4px}
.gbar{width:44px;height:20px;border-radius:4px;background:linear-gradient(160deg,#fff3b0,#f2c230 40%,#b8860b);box-shadow:0 3px 0 #6b4e06,inset 0 0 0 1px rgba(255,255,255,.6);margin-top:-6px}
.fly{position:fixed;z-index:99;pointer-events:none;transition:transform .38s cubic-bezier(.3,.7,.3,1),opacity .38s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qs button{background:var(--card2);color:#fff;border:1px solid var(--line2);border-radius:12px;padding:10px 0;font-weight:900;cursor:pointer}
.win{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:12px 14px;margin:12px 0;font-size:14px;color:var(--txt2)}
.win b{color:var(--em);font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.jk{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(135deg,rgba(178,107,255,.18),rgba(236,72,153,.14));border:1px solid rgba(178,107,255,.5);border-radius:14px;padding:10px 12px;margin:10px 0;font-weight:700;font-size:14px;cursor:pointer}
.jk.on{background:rgba(169,123,255,.2);border-color:var(--p);box-shadow:0 0 0 4px rgba(169,123,255,.12)}
.sw{width:44px;height:26px;border-radius:99px;background:#3a3a4a;position:relative;flex:0 0 auto}.sw:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.jk.on .sw{background:var(--p)}.jk.on .sw:after{right:21px}
.csgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:4px}
.step{display:flex;align-items:center;justify-content:center;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;border:0;font-size:24px;font-weight:900;cursor:pointer}
.step .plus{background:var(--gold);color:#0A0E1C}.step .minus{background:var(--card3);color:#fff}
.step .val{font-size:32px;font-weight:900;min-width:30px;text-align:center}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:900;cursor:pointer;background:linear-gradient(180deg,#D9FF5C,var(--gold2));color:#0A0E1C;box-shadow:0 8px 24px rgba(198,244,50,.25);transition:transform .1s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45}
.btn.sec{background:var(--card2);color:#fff;box-shadow:none;font-size:15px;padding:12px;border:1px solid var(--line2)}
/* טבלאות */
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--mut);font-weight:700;padding:8px 3px;text-align:center;letter-spacing:.2px}
td{padding:10px 3px;text-align:center;border-top:1px solid var(--line);font-weight:700;font-size:14px}
td.n{text-align:right;font-weight:900}
tr.me td{background:rgba(198,244,50,.07)}
.big{font-size:17px;font-weight:900}
.pos{color:var(--em)}.neg{color:var(--red)}
.tag{display:block;font-size:11px;font-weight:700;margin-top:3px}
.tag.k{color:var(--gold)}.tag.l{color:#ff9fa2}.tag.p{color:#f5b971}
.arr{font-size:11px;font-weight:900;margin-inline-start:5px}.arr.up{color:var(--em)}.arr.dn{color:var(--red)}
.lt td{font-size:13px;padding:8px 2px}.lt td.n{display:flex;align-items:center;gap:7px}.lt img{width:20px;height:20px;object-fit:contain}
.lt tr.lv td{background:rgba(255,90,95,.07)}
/* טבלה + ארצית – לפי העיצוב */
.thd{display:flex;align-items:center;gap:10px;margin:18px 2px 14px}.thd h1{margin:0;font-size:24px;font-weight:900}
.scp{margin-inline-start:auto;max-width:62%;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:999px;background:var(--card);color:var(--txt2);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.scp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mehero{border-radius:24px;padding:20px;background:var(--gold);color:var(--on-accent);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;margin-bottom:14px}
.mehero .il{position:absolute;left:-20px;bottom:-40px;font-family:Karantina,Heebo,sans-serif;font-weight:700;font-size:200px;line-height:1;opacity:.1;pointer-events:none}
.mehero>span{font-size:13px;font-weight:700;position:relative}.mehero b{font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px;position:relative}
.mehero .sub{font-size:15px}.mehero .mv{display:inline-flex;align-self:flex-start;background:var(--on-accent);color:var(--em);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:900;margin-top:6px}.mehero .mv.dn{color:var(--red2)}
.bank2{position:relative;overflow:hidden;border-radius:24px;padding:20px;background:radial-gradient(120% 120% at 100% 0%,#24305F 0%,#121A3A 45%,#0F1426 100%);border:1px solid var(--line3);display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.bank2:before{content:"";position:absolute;left:-30px;top:-30px;width:160px;height:160px;border-radius:50%;border:24px solid rgba(198,244,50,.06)}
.bank2 .hd{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--txt2)}
.bank2 .vv{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.bank2 .vv b{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}

<div id="sheetBg" onclick="closeSheet()"></div><div id="sheet"></div>
<div id="goalbar"></div><div id="final"></div><canvas id="conf"></canvas>

<script>
// ================= מצב =================
// ציבורי: משחקים, טבלאות, דירוג, הימורים שנחשפו. פרטי: החשבון שלי בלבד (לפי המפתח הסודי של המכשיר).
let S = { fixtures:{}, tables:{}, standings:null, revealed:{}, meta:{}, lg:{} };
let A = null;            // החשבון שלי (acct/<secret>) – רק מי שמחזיק את המפתח יכול לקרוא/לכתוב
let AV = null;           // תצוגת מנהל
let connected=false, loaded={}, seenGoals=null, goalTimer=null;
let tab = lsGet('bb_tab') || 'games', dayF=null, lgF=lsGet('bb_lg')||'isr1', tblMode=lsGet('bb_tm')||'week', adIdx=Math.floor(Math.random()*ADS.length);
let sheetSt=null;
let POKER = lsGet('bb_poker')!=='0';   // מצב פוקר (ז'יטונים) – ברירת מחדל פעיל, אפשר לכבות
function togglePoker(){ POKER=!POKER; lsSet('bb_poker',POKER?'1':'0'); toast(POKER?'מצב פוקר פעיל 🎰':'חזרת למצב רגיל',true); if(sheetSt&&!sheetSt.custom) renderSheet(); render(); }
function lsGet(k){ try{return localStorage.getItem(k)}catch(e){return null} }
function lsSet(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v) }catch(e){} }
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const he = t => HE[t] || t;
const fmt = n => Math.round(n).toLocaleString('he-IL');
const sgn = n => (n>0?'+':'')+fmt(n);
const logo = img => img ? `<img src="https://lsm-static-prod.livescore.com/medium/${esc(img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '';
const rnd = (n, abc) => { const a=new Uint32Array(n); crypto.getRandomValues(a); return [...a].map(x=>abc[x%abc.length]).join(''); };
const AZ='abcdefghijklmnopqrstuvwxyz0123456789', AZM='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const RCA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // בלי O/0/I/1 – לא מתבלבלים
const fmtRc = c => c? c.match(/.{1,4}/g).join('-') : '';
const nkOf = name => name.toLowerCase().replace(/ /g,'');

// מעבר לכתובת הקבועה bet-it.web.app – מעבירים איתנו את מפתח המכשיר (בחלק של הכתובת שלא נשלח לשום שרת)
(function migrateHost(){
  const NEW='https://bet-it.web.app';
  if(location.hostname.endsWith('github.io')){
    const p=new URLSearchParams(); ['bb_sec','bb_ak','bb_pending','bb_tab'].forEach(k=>{ const v=lsGet(k); if(v) p.set(k,v); });
    const adm=/\/admin\/?$/.test(location.pathname)||/[?&]admin=1/.test(location.search);
    const h=location.hash.replace(/^#/,''); location.replace(NEW+(adm?'/?admin=1':'/')+'#'+(h?h+'&':'')+'mig='+encodeURIComponent(p.toString()));
    throw new Error('moving to '+NEW);
  }
  const m=location.hash.match(/mig=([^&]*)/);
  // רק מפתחות מוכרים ובפורמט תקין – לינק זדוני לא יכול להשתיל הימורים בתור (bb_q) או ערכים מוזרים
  const OK={bb_sec:/^s[A-Za-z0-9]{40,64}$/, bb_pending:/^s[A-Za-z0-9]{40,64}$/, bb_ak:/^k[A-Za-z0-9]{40}$/, bb_tab:/^(games|mine|table|leagues|admin)$/};
  if(m){ new URLSearchParams(decodeURIComponent(m[1])).forEach((v,k)=>{ if(OK[k]&&OK[k].test(v)&&!lsGet(k)) lsSet(k,v); });
    const rest=location.hash.replace(/^#/,'').split('&').filter(x=>x&&!x.startsWith('mig=')).join('&');
    history.replaceState(null,'',location.pathname+location.search+(rest?'#'+rest:'')); }
})();
// מפתח המכשיר (סודי) – נשמר רק בטלפון. מפתח מנהל – רק במכשיר של המנהל.
let SEC = lsGet('bb_sec');
let PENDING = lsGet('bb_pending');      // בקשת שחזור שממתינה לאישור מנהל
let AK = lsGet('bb_ak');
(function grabJoin(){ const m=location.hash.match(/join=([A-Za-z0-9]{6})/); if(m){ lsSet('bb_join',m[1].toUpperCase()); history.replaceState(null,'',location.pathname+location.search); } })();
(function grabAdminKey(){ const m=location.hash.match(/k=(k[A-Za-z0-9]{40})/); if(m){ AK=m[1]; lsSet('bb_ak',AK); history.replaceState(null,'',location.pathname+location.search); tab='admin'; } })();

// ================= זמן (שעון ישראל) =================
const dkFmt = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'});
const dayKey = ms => dkFmt.format(new Date(ms));
const hm = ms => new Date(ms).toLocaleTimeString('he-IL',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit'});
const dkToDate = dk => { const [y,m,d]=dk.split('-').map(Number); return new Date(Date.UTC(y,m-1,d,12)); };
const addDays = (dk,n) => { const d=dkToDate(dk); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function dayLabel(dk){ const t=dayKey(Date.now()); if(dk===t) return 'היום'; if(dk===addDays(t,1)) return 'מחר'; if(dk===addDays(t,-1)) return 'אתמול';
  const d=dkToDate(dk); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()}.${d.getUTCMonth()+1}`; }
function weekKey(dk){ const d=dkToDate(dk); return addDays(dk,-((d.getUTCDay()-2+7)%7)); }
const weekLabel = wk => { const a=dkToDate(wk), b=dkToDate(addDays(wk,6)); return `<bdi dir="ltr">${a.getUTCDate()}.${a.getUTCMonth()+1}–${b.getUTCDate()}.${b.getUTCMonth()+1}</bdi>`; };

// ================= חיבור ל-Firebase =================
// חיבור אחד (WebSocket) לכל ההאזנות והכתיבות – בלי מגבלת חיבורים של הדפדפן, גם עם כמה לשוניות פתוחות.
const FBV='10.12.5';
const fbReady=(async()=>{
  const [appM,dbM]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-database.js`)]);
  const app=appM.initializeApp({databaseURL:DB});
  const db=dbM.getDatabase(app);
  dbM.onValue(dbM.ref(db,'.info/connected'), s=>{ connected=!!s.val(); renderTop(); });
  return {...dbM, db};
})();
const unsubs={}, pendingBids=new Set();
async function stream(name, path, onData, since){
  const F=await fbReady; if(unsubs[name]) unsubs[name]();
  let r=F.ref(F.db,path); if(since) r=F.query(r,F.orderByChild('ko'),F.startAt(since));
  unsubs[name]=F.onValue(r, snap=>onData(snap.val()), err=>console.warn('listen',name,err&&err.message));
}
function listenAll(){
  stream('fx','fixtures', v=>{ S.fixtures=v||{}; loaded.fx=true; detectGoals(); render(); if(sheetSt) renderSheet(); }, Date.now()-3*86400e3);
  stream('tb','pub/tables', v=>{ S.tables=v||{}; if(tab==='leagues') render(); });
  stream('st','pub/standings', v=>{ S.standings=v; if(!sheetSt) render(); });
  stream('rv','pub/revealed', v=>{ S.revealed=v||{}; if(tab==='games'&&!sheetSt) render(); });
  stream('mt','pub/meta', v=>{ S.meta=v||{}; if(tab==='admin') render(); });
  stream('lg','pub/lg', v=>{ S.lg=v||{}; if(tab==='table'&&!sheetSt) render(); });
  stream('cnt','pub/cnt', v=>{ S.cnt=v||{}; if(tab==='games'&&!sheetSt) render(); });
  listenMine();
  if(AK) stream('av',`adminView/${AK}`, v=>{ AV=v||{}; if(tab==='admin') render(); });
}
function listenMine(){
  if(SEC) stream('me',`acct/${SEC}`, v=>{ A=v; loaded.me=true; if(!A){ SEC=null; lsSet('bb_sec',null); } else { if(!A.rc && !ensureRc.busy) ensureRc(); const j=lsGet('bb_join'); if(j){ lsSet('bb_join',null); setTimeout(()=>joinLeague(j),700); } } render(); if(sheetSt&&!sheetSt.custom) renderSheet(); });
  else if(PENDING) stream('me',`acct/${PENDING}`, v=>{ if(v){ SEC=PENDING; PENDING=null; lsSet('bb_sec',SEC); lsSet('bb_pending',null); A=v; toast('השחזור אושר! ברוך השב 🎉',true); listenMine(); } render(); });
}
async function readOnce(path){ const F=await fbReady; return Promise.race([F.get(F.ref(F.db,path)).then(s=>s.val()), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]); }

// ================= כתיבה: אישור מהשרת בלבד; דחייה של חוקי האבטחה = 'denied', בלי קליטה = 'fail' =================
async function write(method, path, body, quiet){
  const F=await fbReady, r=path?F.ref(F.db,path):F.ref(F.db);
  const op = method==='PATCH' ? F.update(r,body) : (method==='DELETE'||body===null) ? F.remove(r) : F.set(r,body);
  const res = await Promise.race([ op.then(()=>'ok', e=>/permission/i.test(String(e&&(e.code||e.message)))?'denied':'fail'),
                                   new Promise(x=>setTimeout(()=>x('fail'),12000)) ]);
  if(res==='fail' && !quiet) toast('אין קליטה 📶 – לא נשמר עדיין',false,'err');
  return res;
}
const SV = {'.sv':'timestamp'};

// ================= משחקים והימורים =================
const isLocked = f => !f || f.st!=='none' || Date.now() >= f.ko - LOCK_BEFORE_MS;
const fxList = () => Object.entries(S.fixtures).map(([id,f])=>({id,...f}));
function pickLabel(f,b){ if(b.m==='CS'){ const [h,a]=b.p.split('-'); return `מדויק ${he(f?f.home:'')} ${h}–${a} ${he(f?f.away:'')}`; }
  return b.p==='X'?'תיקו':`ניצחון ${he(f?(b.p==='1'?f.home:f.away):'')}`; }
const sign = n => n>0?1:n<0?-1:0;
const legWins = (f,b) => b.m==='CS' ? `${f.h}-${f.a}`===b.p : ({'1':1,'X':0,'2':-1})[b.p]===sign(f.h-f.a);
const payout = b => b.j ? Math.round(b.s + 2*(b.s*b.o - b.s)) : Math.round(b.s*b.o);
function betState(bid, b){
  const st = A && A.settled && A.settled[bid]; if(st) return st.st;
  const f=S.fixtures[b.e]; if(!f) return 'open';
  if(f.st==='postp') return 'void';
  if(f.st==='finished') return legWins(f,b)?'won':'lost';
  if(f.st==='live') return legWins(f,b)?'live-win':'live-lose';
  return 'open';
}
// סיכוי זכייה לייב: לפי התוצאה עכשיו, הדקה, וצפי השערים של שתי הקבוצות (מודל פואסון)
function minuteOf(f){ const m=(f.min||'').trim(); if(m==='HT') return 45; const n=parseInt(m,10); return isNaN(n)?45:Math.min(90,n); }
const pois=(k,l)=>{ let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; };
function winProb(f,b){
  if(!f||f.st!=='live') return null;
  const lam=f.lam||{h:1.4,a:1.1}, r=Math.max(0,(90-minuteOf(f))/90), lh=lam.h*r, la=lam.a*r; let p=0;
  for(let i=0;i<=8;i++) for(let j=0;j<=8;j++){ const q=pois(i,lh)*pois(j,la); if(legWins({h:f.h+i,a:f.a+j},b)) p+=q; }
  return Math.max(0,Math.min(1,p));
}
const pctTag = p => p==null?'':`<span class="pct" style="--p:${Math.round(p*100)}%">${Math.round(p*100)}%</span>`;
const myBets = () => Object.entries((A&&A.bets)||{});
// היתרה האמיתית מגיעה מהשרת; "לייב" = כאילו המשחקים נגמרים עכשיו (לתצוגה בלבד)
function account(){
  if(!A) return null;
  // יתרה לייב = היתרה + מה שההימורים במשחקים שרצים עכשיו היו מחזירים אם המשחק נגמר כרגע
  const avail=(A.wallet&&A.wallet.bal)||0; let value=avail, open=0;
  myBets().forEach(([id,b])=>{ if(A.settled&&A.settled[id]) return; const st=betState(id,b);
    if(st==='live-win') value+=payout(b); if(st==='open'||st.startsWith('live')) open++; });
  const done=Object.values(A.settled||{}).filter(x=>x.st!=='void'), won=done.filter(x=>x.st==='won').length;
  return {avail, value, open, won, settled:done.length};
}
const jokerUsed = dk => !!(A && A.jokers && A.jokers[dk]);

// ================= רינדור =================
function ad(){ return ''; }   // הוסר לבקשת גל – מקום לתוכן בעל ערך בהמשך
function liveTag(f){ const m=(f.min||'').trim(); const t=!m?'':m==='HT'?' · מחצית':` · <bdi dir="ltr">${esc(m.replace(/'$/,''))}'</bdi>`; return `<span class="live">חי${t}</span>`; }
let shownBal=null, balAnim=null;
function animateBal(to){
  if(shownBal===null){ shownBal=to; return; }
  const from=shownBal; if(Math.round(from)===Math.round(to)){ shownBal=to; return; }
  const el=document.getElementById('bal'), d=to-from;
  if(el){ el.classList.remove('up','dn'); el.classList.add(d>0?'up':'dn'); setTimeout(()=>el&&el.classList.remove('up','dn'),1600);
    const r=el.getBoundingClientRect(), f=document.createElement('div'); f.className='delta '+(d>0?'up':'dn'); f.textContent=(d>0?'+':'')+fmt(d)+' 🪙';
    f.style.left=(r.left+r.width/2)+'px'; f.style.top=(r.bottom+4)+'px'; document.body.appendChild(f); setTimeout(()=>f.remove(),1900); }
  cancelAnimationFrame(balAnim); const t0=performance.now();
  (function step(t){ const k=Math.min(1,(t-t0)/900), v=from+(to-from)*(1-Math.pow(1-k,3)); shownBal=v;
    const n=document.getElementById('balV'); if(n) n.textContent=fmt(v); if(k<1) balAnim=requestAnimationFrame(step); else shownBal=to; })(t0);
}
function renderTop(){
  const a=account(), bank=S.standings?S.standings.bank:BANK_START;
  const cd=document.getElementById('cdot'); if(cd) cd.className=connected?'on':'';
  document.getElementById('top').innerHTML = `
    <span class="pill bankp" onclick="go('table')" title="קופת הבנק"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8E97B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>${fmt(bank)}</span>
    ${a?`<span class="bal ${a.value!==a.avail?'lv':''}" id="bal" onclick="go('mine')"><span class="coin"></span><span id="balV">${fmt(shownBal??a.value)}</span>${a.value!==a.avail?'<small>לייב</small>':''}</span>`:''}`;
  if(a) animateBal(a.value); else shownBal=null;
}
// ===== כרטיס משחק – לפי העיצוב =====
const LGCODE={isr1:'IL',isr2:'IL',eng:'EN',ita:'IT'};
const hueOf=t=>{ let h=0; for(const c of String(t)) h=(h*31+c.charCodeAt(0))%360; return h; };
function crest(img,name){ return `<span class="crest">${img?`<img src="https://lsm-static-prod.livescore.com/medium/${esc(img)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc(he(name).slice(0,2))}'))">`:`<span style="color:hsl(${hueOf(name)} 70% 70%)">${esc(he(name).slice(0,2))}</span>`}</span>`; }
// סיכויי 1/X/2 בזמן אמת (לפי התוצאה, הדקה וצפי השערים)
function outcomeProbs(f){ const lam=f.lam||{h:1.4,a:1.1}, r=Math.max(0,(90-minuteOf(f))/90), lh=lam.h*r, la=lam.a*r; let p1=0,px=0,p2=0;
  for(let i=0;i<=8;i++) for(let j=0;j<=8;j++){ const q=pois(i,lh)*pois(j,la), H=f.h+i, X=f.a+j; if(H>X) p1+=q; else if(H===X) px+=q; else p2+=q; }
  const t=p1+px+p2||1; return [p1/t,px/t,p2/t]; }
function statusPill(st,b,f){ const p=f?winProb(f,b):null, pct=p!=null?` · ${Math.round(p*100)}%`:'';
  if(st==='won') return `<span class="stp win"><i></i>זכה · <bdi dir="ltr">+${fmt(payout(b)-b.s)}</bdi></span>`;
  if(st==='lost') return `<span class="stp lose"><i></i>הפסד</span>`;
  if(st==='live-win') return `<span class="stp win"><i></i>כרגע זוכה${pct}</span>`;
  if(st==='live-lose') return `<span class="stp lose"><i></i>כרגע מפסיד${pct}</span>`;
  if(st==='void') return `<span class="stp void">↩ הוחזר</span>`;
  return `<span class="stp open">פתוח · אפשרי <bdi dir="ltr">${fmt(payout(b))}</bdi></span>`; }
function fxCard(f){
  const L=isLocked(f), mine=myBets().filter(([id,b])=>b.e===f.id), o=f.odds||{}, live=f.st==='live', done=f.st==='finished';
  const cd=f.ko-LOCK_BEFORE_MS-Date.now(), hh=Math.floor(cd/3600e3), mm=Math.floor(cd%3600e3/60e3);
  const clock='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const right = live ? '' : f.st==='postp' ? '<span class="fin">נדחה</span>' : done ? '<span class="fin">הסתיים</span>'
    : mine.some(([id,b])=>b.j) ? '<span class="badge2 jk">ג׳וקר הופעל</span>'
    : cd<=0 ? `<span class="lock">${clock}ננעל</span>` : cd<6*3600e3 ? `<span class="lock">${clock}ננעל בעוד ${hh?hh+':'+String(mm).padStart(2,'0'):mm+' דק׳'}</span>` : '';
  const left = live ? `<span class="lvl"><span class="pdot"></span>לייב · <bdi dir="ltr">${esc((f.min||'').replace('HT','מחצית'))}</bdi></span>` : `<span class="when">${dayLabel(dayKey(f.ko))} · ${hm(f.ko)}</span>`;
  const mid = live||done ? `<div class="score"><span class="${live&&f.h>f.a?'hi':''}">${f.h}</span><span class="sep">:</span><span class="${live&&f.a>f.h?'hi':''}">${f.a}</span></div>` : `<span class="vs">נגד</span>`;
  const ob=(k,lab)=>{ const has=mine.some(([id,b])=>b.m==='W'&&b.p===k);
    return `<button class="ob ${has?'mine':''}" ${L||!o[k]||!A?'disabled':''} onclick="openBet('${f.id}','W','${k}')"><span class="l">${lab}</span><span class="v">${o[k]?o[k].toFixed(2):'–'}</span></button>`; };
  let h=`<article class="fx ${live?'islive':''}"><div class="top"><span>${left}</span>${right}</div>
    <div class="teams" style="direction:rtl"><div class="tm">${crest(f.hi,f.home)}${esc(he(f.home))}</div><div class="mid">${mid}</div><div class="tm">${crest(f.ai,f.away)}${esc(he(f.away))}</div></div>`;
  if(live){ const [p1,px,p2]=outcomeProbs(f), mx=Math.max(p1,px,p2), P=v=>Math.round(v*100);
    h+=`<div class="pbar"><div class="seg3"><span class="${p1===mx?'top':''}" style="width:${P(p1)}%"></span><span class="x ${px===mx?'top':''}" style="width:${P(px)}%"></span><span class="${p2===mx?'top':''}" style="width:${P(p2)}%"></span></div>
      <div class="lbl"><span class="${p1===mx?'top':''}">${esc(he(f.home))} ${P(p1)}%</span><span class="${px===mx?'top':''}">תיקו ${P(px)}%</span><span class="${p2===mx?'top':''}">${esc(he(f.away))} ${P(p2)}%</span></div></div>`; }
  if(f.st==='none') h+=`<div class="odds">${ob('1',esc(he(f.home)))}${ob('X','תיקו')}${ob('2',esc(he(f.away)))}</div>
    <button class="csb" ${L||!o.cs||!A?'disabled':''} onclick="openBet('${f.id}','CS','1-0')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>${mine.length?'הוסף הימור על תוצאה מדויקת':'הימור על תוצאה מדויקת'}</button>`;
  QUEUE.filter(q=>q.e===f.id).forEach(q=>{ h+=`<div class="mybet"><span>${esc(pickLabel(f,q))} · <b>${fmt(q.s)}</b></span><span class="stp open">⏳ ממתין לקליטה</span></div>`; });
  mine.forEach(([id,b])=>{ const st=betState(id,b);
    h+=`<div class="mybet ${b.j?'jk':''}"><span>שלך: <b>${esc(pickLabel(f,b))} · ${fmt(b.s)}</b>${b.j?' <b style="color:var(--p2)">×2</b>':''} <span style="color:var(--mut)">ביחס ${b.o.toFixed(2)}</span></span>

// ===== תור הימורים: בלי קליטה ההימור נשמר בטלפון ונשלח אוטומטית כשהקליטה חוזרת =====
let QUEUE=[]; try{ QUEUE=JSON.parse(lsGet('bb_q')||'[]'); }catch(e){ QUEUE=[]; }
const saveQ=()=>lsSet('bb_q', QUEUE.length?JSON.stringify(QUEUE):null);
function buildBet(it){   // בונה את העדכון לפי היתרה העדכנית מהשרת
  const f=S.fixtures[it.e]; const o=f&&f.odds?(it.m==='CS'?(f.odds.cs||{})[it.p]:f.odds[it.p]):null;
  const bet={e:it.e,m:it.m,p:it.p,s:it.s,o:o,at:SV}, dk=f?(f.day||dayKey(f.ko)):null;
  const upd={[`acct/${SEC}/bets/${it.bid}`]:bet, [`acct/${SEC}/wallet/bal`]:A.wallet.bal-it.s, [`acct/${SEC}/wallet/op`]:'b:'+it.bid};
  if(it.j && dk && !jokerUsed(dk)){ bet.j=true; upd[`acct/${SEC}/jokers/${dk}`]=it.bid; }
  return {upd, f, o};
}
async function sendBet(it, quiet){
  for(let attempt=0; attempt<3; attempt++){
    if(!A||!A.wallet) return 'fail';
    if(A.bets&&A.bets[it.bid]&&connected&&!pendingBids.has(it.bid)) return 'ok';   // כבר נשמר ואושר
    const {upd,f,o}=buildBet(it);
    if(!f||isLocked(f)) return 'locked';
    if(!o) return 'noodds';
    if(it.o && o!==it.o) return 'oddschg';                       // היחס השתנה מאז שהשחקן לחץ – לא שולחים ביחס אחר בלי לשאול
    if(it.s>A.wallet.bal) return 'nofunds';
    pendingBids.add(it.bid); const r=await write('PATCH','',upd, true); if(r!=='fail') pendingBids.delete(it.bid);
    if(r==='ok') return 'ok';
    if(r==='fail') return 'fail';
    try{ if(await readOnce(`acct/${SEC}/bets/${it.bid}`)){ pendingBids.delete(it.bid); return 'ok'; } }catch(e){}   // אולי כבר נשמר בשליחה קודמת
    await new Promise(x=>setTimeout(x,1500));                    // נדחה (למשל הרובוט עדכן יתרה באותו רגע) – מנסה שוב עם נתונים עדכניים
  }
  return 'denied';
}
async function flushQueue(){
  if(!QUEUE.length||!A) return;
  for(const it of [...QUEUE]){
    const r=await sendBet(it,true);
    if(r==='fail') break;                                         // עדיין אין קליטה
    QUEUE=QUEUE.filter(x=>x.bid!==it.bid); saveQ();
    if(r==='ok') toast('ההימור שחיכה לקליטה נשמר! ✅',true);
    else toast(r==='locked'?"המשחק ננעל לפני שחזרה הקליטה – ההימור לא נשלח והז'יטונים נשארו אצלך":r==='oddschg'?"היחס השתנה בזמן שלא הייתה קליטה – ההימור לא נשלח, אפשר להמר שוב ביחס החדש":"הימור שחיכה לקליטה לא נשלח – הז'יטונים נשארו אצלך",false,'err',5000);
  }
  render();
}

async function placeBet(){
  const f=S.fixtures[sheetSt.eid]; if(!f||isLocked(f)) return toast('המשחק ננעל 🔒',false,'err');
  const s=Math.floor(sheetSt.s||0), o=sheetOdds(), bal=A.wallet.bal, dk=f.day||dayKey(f.ko);
  if(!o) return toast('אין יחס לבחירה הזו',false,'err'); if(s<1) return toast("כמה ז'יטונים? 🙂",false,'err');
  if(s>bal) return toast(`אין מספיק ז'יטונים – יתרה ${fmt(bal)}`,false,'err');
  const it={bid:'b'+Date.now().toString(36)+rnd(4,AZ), e:sheetSt.eid, m:sheetSt.m, p:sheetSt.p, s, o, j:!!(sheetSt.j&&!jokerUsed(dk)), at:Date.now()};

  else { btn.disabled=false; btn.textContent='הימור!';
    toast(r==='locked'?'המשחק ננעל 🔒':r==='nofunds'?"אין מספיק ז'יטונים":'ההימור נדחה – היחס התעדכן. בדוק ונסה שוב',false,'err',4000); renderSheet(); }
}
async function cancelBet(bid){
  const b=A&&A.bets&&A.bets[bid]; if(!b) return; const f=S.fixtures[b.e];
  if(A.settled&&A.settled[bid]) return toast('ההימור כבר נסגר – הז\'יטונים כבר חזרו אליך',false,'err',3500);
  if(isLocked(f)) return toast('המשחק ננעל – אי אפשר לבטל 🔒',false,'err');
  if(!confirm(`לבטל את ההימור (${fmt(b.s)} ז'יטונים יחזרו אליך)?`)) return;
  const upd={[`acct/${SEC}/bets/${bid}`]:null, [`acct/${SEC}/wallet/bal`]:A.wallet.bal+b.s, [`acct/${SEC}/wallet/op`]:'c:'+bid};
  if(b.j) upd[`acct/${SEC}/jokers/${f.day||dayKey(f.ko)}`]=null;
  const r=await write('PATCH','',upd);
  if(r==='ok') toast('ההימור בוטל ↩️',true); else toast(r==='denied'?'לא ניתן לבטל כרגע':'אין קליטה – הביטול לא נשלח, נסה שוב',false,'err',4000);
}

  h+=`<section class="asec alog"><div class="st" style="border:0"><b>יומן פעולות</b></div>${log.length?log.map(l=>`<div><span>${T(l.at)}</span><span style="color:var(--warn)">מנהל</span><span>${esc(OPN[l.t]||l.t)} · <span style="color:${l.res==='ok'?'var(--em)':'var(--red2)'}">${l.res==='ok'?'בוצע':esc(l.res)}</span></span></div>`).join(''):'<div><span></span><span></span><span class="muted">עוד אין פעולות</span></div>'}</section></div>`;
  return h;
}
const agoAdm = ms => { const s=Math.round((Date.now()-ms)/1000); return s<60?`לפני ${Math.max(1,s)} שניות`:s<3600?`לפני ${Math.round(s/60)} דק׳`:s<86400?`לפני ${Math.round(s/3600)} שע׳`:new Date(ms).toLocaleDateString('he-IL'); };
function admFilter(q){ q=String(q||'').trim().toLowerCase(); document.querySelectorAll('#admUsers .urow').forEach(r=>{ r.style.display=!q||r.dataset.n.includes(q)?'':'none'; }); }
function admAdjust(pid,sg){ const u=(AV&&AV.users||[]).find(x=>x.pid===pid); if(!u) return;
  const v=prompt(`כמה ז׳יטונים ${sg>0?'להוסיף ל':'להוריד מ'}${u.n}? (יתרה עכשיו: ${fmt(u.bal)})`); if(!v) return; const d=Math.abs(Math.round(+v));
  if(!d||isNaN(d)) return toast('מספר לא תקין',false,'err'); adminOp('adjust',{pid,d:sg*d}); }
function delUser(pid){ const u=(AV&&AV.users||[]).find(x=>x.pid===pid); if(u&&confirm(`למחוק את ${u.n} וכל ההימורים שלו?\nאי אפשר לבטל את זה.`)) adminOp('delete',{pid}); }
function admFix(id,st){ const f=S.fixtures[id]; if(!f) return; const h=parseInt(document.getElementById('fh_'+id).value,10), a=parseInt(document.getElementById('fa_'+id).value,10);
  if(st==='finished'&&(isNaN(h)||isNaN(a)||h<0||a<0||h>30||a>30)) return toast('תוצאה לא תקינה',false,'err');
  if(!confirm(st==='postp'?`לסמן את ${he(f.home)} – ${he(f.away)} כנדחה? ההימורים יוחזרו.`:`לקבוע תוצאה סופית ${he(f.home)} ${h}–${a} ${he(f.away)} ולסגור את ההימורים?`)) return;
  adminOp('fix',{e:id,h:st==='postp'?0:h,a:st==='postp'?0:a,st}); }

// ================= ניווט =================
const ICONS={
  games:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M16 10l4.5-1.5M14.5 14.5l2.5 4M9.5 14.5l-2.5 4M8 10L3.5 8.5"/></svg>',
  mine:'<svg viewBox="0 0 24 24"><path d="M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/></svg>',
  table:'<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  leagues:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  admin:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'};
function renderNav(){
  const a=account(), openN=a?a.open:0;
  const tabs=[['games','משחקים'],['mine','ההימורים שלי'],['table','טבלה'],['leagues','ליגות']].filter(t=>A||t[0]!=='mine');
  if(AK) tabs.push(['admin','מנהל']);
  document.getElementById('nav').innerHTML=(A||AK)?tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${ICONS[k]}${l}${k==='mine'&&openN?`<span class="badge">${openN}</span>`:''}</button>`).join(''):'';
}
function go(k){ tab=k; lsSet('bb_tab',k); render(); window.scrollTo(0,0); }
function render(){
  renderTop(); const app=document.getElementById('app');
  if(!A && !AK){ app.innerHTML=(SEC&&!loaded.me)?'<div class="empty"><div class="e">⏳</div>מתחבר…</div>':viewLogin()+footer(); renderNav(); return; }
  if(!A && tab==='mine') tab='games'; if(tab==='admin'&&!AK) tab='games';
  app.innerHTML=({games:viewGames,mine:viewMine,table:viewTable,leagues:viewLeagues,admin:viewAdmin}[tab]||viewGames)()+footer(); renderNav();
}
const footer=()=>`<footer>BET-IT · משחק הניחושים של החבר׳ה<br>לשם הכיף בלבד · אין כסף אמיתי ואין אפשרות לקנות ז'יטונים</footer>`;

// ================= באנר גול =================
function detectGoals(){
  const now={}; fxList().forEach(f=>{ if(f.st==='live'||f.st==='finished') now[f.id]=(f.h|0)+(f.a|0); });
  if(seenGoals) for(const id in now) if(seenGoals[id]!==undefined && now[id]>seenGoals[id]) showGoal({id,...S.fixtures[id]});
  seenGoals=now;
}
function showGoal(f){
  const mine=myBets().filter(([id,b])=>b.e===f.id); let msg='';
  if(mine.length){ const win=mine.filter(([id,b])=>betState(id,b)==='live-win');
    msg=win.length?`<br>🤑 ההימור שלך כרגע זוכה! +${fmt(win.reduce((t,[id,b])=>t+payout(b)-b.s,0))} 🪙`:'<br>😬 ההימור שלך כרגע מפסיד – יש עוד זמן!'; }
  const el=document.getElementById('goalbar');
  el.innerHTML=`<span class="bg">⚽ גול!</span>${LEAGUES[f.lg]?.f||''} ${esc(he(f.home))} <bdi dir="rtl">${f.h}–${f.a}</bdi> ${esc(he(f.away))}${msg}`;
  el.classList.add('show'); try{ navigator.vibrate&&navigator.vibrate([120,60,120]) }catch(e){}
  clearTimeout(goalTimer); goalTimer=setTimeout(()=>el.classList.remove('show'),6000);
}
function confetti(n=180){
  const c=document.getElementById('conf'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#FFD000','#FF6B00','#fff','#22c55e','#ff3d7f'];
  const ps=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*6,c:cols[Math.random()*5|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6,va:-.2+Math.random()*.4}));
  const t0=Date.now(); (function f(){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if(Date.now()-t0<4500) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
function toast(msg,big,kind,ms=2400){ document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'+(kind==='err'?' err':'')+(big?' big':''); t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},ms); }

setInterval(()=>{ if(tab==='games'&&!sheetSt&&!document.querySelector('details[open]')) render(); },30000);
render(); listenAll();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});
