const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf = name => name.trim().replace(/[.#$\[\]\/]/g,'_');
const he = t => HE[t] || t;
const fmt = n => Math.round(n).toLocaleString('he-IL');
const sgn = n => (n>0?'+':'')+fmt(n);
const logo = img => img ? `<img src="https://lsm-static-prod.livescore.com/medium/${esc(img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '';

// מזהה מכשיר – רק המכשיר שיצר שחקן יכול להמר בשמו
let DEVICE = lsGet('bb_dev'); if(!DEVICE){ DEVICE = (crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)); lsSet('bb_dev', DEVICE); }
let MYHASH = null;
(async()=>{ try{ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('bb:'+DEVICE)); MYHASH=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=0; for(const c of 'bb:'+DEVICE) h=(h*31+c.charCodeAt(0))|0; MYHASH='h'+(h>>>0).toString(16)+DEVICE.length; } render(); })();
const isMine = p => !p || !p.owner || p.owner===MYHASH;
const myP = () => me ? S.players[keyOf(me)] : null;

// ================= זמן ותאריכים (שעון ישראל) =================
const dkFmt = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'});
const dayKey = ms => dkFmt.format(new Date(ms));                        // 'YYYY-MM-DD'
const hm = ms => new Date(ms).toLocaleTimeString('he-IL',{timeZone:'Asia/Jerusalem',hour:'2-digit',minute:'2-digit'});
const dkToDate = dk => { const [y,m,d]=dk.split('-').map(Number); return new Date(Date.UTC(y,m-1,d,12)); };
const addDays = (dk,n) => { const d=dkToDate(dk); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function dayLabel(dk){
  const t=dayKey(Date.now()); if(dk===t) return 'היום'; if(dk===addDays(t,1)) return 'מחר'; if(dk===addDays(t,-1)) return 'אתמול';
  const d=dkToDate(dk); return `${DAYS[d.getUTCDay()]} ${d.getUTCDate()}.${d.getUTCMonth()+1}`;
}
// שבוע ההימורים: שלישי → שני (סוף שבוע כדורגל נשאר יחד)
function weekKey(dk){ const d=dkToDate(dk); const back=(d.getUTCDay()-2+7)%7; return addDays(dk,-back); }
const weekLabel = wk => { const a=dkToDate(wk), b=dkToDate(addDays(wk,6)); return `${a.getUTCDate()}.${a.getUTCMonth()+1}–${b.getUTCDate()}.${b.getUTCMonth()+1}`; };
function bonusWeeks(joined){ if(!joined) return 0; let n=0, w=weekKey(dayKey(joined)); const cur=weekKey(dayKey(Date.now())); while(w<cur && n<200){ w=addDays(w,7); n++; } return n; }

// ================= Firebase: האזנה חיה + כתיבה =================
function applyAt(path, data){
  const parts=path.split('/').filter(Boolean);
  if(!parts.length){ S=Object.assign({fixtures:{},tables:{},players:{},meta:{}}, data||{}); return; }
  let o=S; for(let i=0;i<parts.length-1;i++){ if(typeof o[parts[i]]!=='object'||o[parts[i]]===null) o[parts[i]]={}; o=o[parts[i]]; }
  const last=parts[parts.length-1]; if(data===null) delete o[last]; else o[last]=data;
  S.fixtures=S.fixtures||{}; S.tables=S.tables||{}; S.players=S.players||{}; S.meta=S.meta||{};
}
function listen(){
  const es=new EventSource(`${DB}/${NODE}.json`);
  const on = isPatch => ev => {
    const {path,data}=JSON.parse(ev.data);
    if(isPatch) for(const k in data) applyAt(path.replace(/\/$/,'')+'/'+k, data[k]); else applyAt(path,data);
    connected=true;
    if(path==='/meta/robotAt'){ if(tab==='admin') render(); return; }      // דופק הרובוט – בלי לרנדר
    if(firstLoad){ firstLoad=false; afterFirstLoad(); }
    detectGoals(); render(); if(sheetSt) renderSheet();
  };
  es.addEventListener('put',on(false)); es.addEventListener('patch',on(true));
  es.onerror=()=>{ connected=false; renderTop(); }; es.onopen=()=>{ connected=true; renderTop(); };
}
async function api(method, path, body){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),8000);
  try{ const r=await fetch(`${DB}/${NODE}${path?'/'+path:''}.json`,{method,body:body===undefined?undefined:JSON.stringify(body),signal:ctl.signal}); if(!r.ok) throw new Error('save'); return r; }
  finally{ clearTimeout(t); }
}
async function save(method, path, body, okMsg='נשמר! ✅'){
  for(let i=1;i<=4;i++){
    try{ await api(method,path,body); if(okMsg) toast(okMsg,true); return true; }
    catch(e){ if(i<4){ toast(`השמירה נכשלה 📶 מנסה שוב… (${i+1}/4)`,false,'err'); await new Promise(r=>setTimeout(r,1200*i)); } }
  }
  toast('❌ לא נשמר – בדוק קליטה ונסה שוב',false,'err',5000); return false;
}

// ================= משחקים, נעילה, הימורים =================
const isLocked = f => !f || f.st!=='none' || Date.now() >= f.ko - LOCK_BEFORE_MS;
const fxList = () => Object.entries(S.fixtures).map(([id,f])=>({id,...f}));
function pickLabel(f, b){
  if(b.m==='CS'){ const [h,a]=b.p.split('-'); return `מדויק ${he(f?f.home:'')} ${h}–${a} ${he(f?f.away:'')}`; }
  return b.p==='X' ? 'תיקו' : `ניצחון ${he(f?(b.p==='1'?f.home:f.away):'')}`;
}
const sign = n => n>0?1:n<0?-1:0;
function legWins(f, b){
  if(b.m==='CS') return `${f.h}-${f.a}`===b.p;
  return ({'1':1,'X':0,'2':-1})[b.p] === sign(f.h-f.a);
}
const payout = b => b.j ? b.s + 2*(b.s*b.o - b.s) : b.s*b.o;           // 🃏 ג'וקר: רווח כפול
// מצב הימור: open / live-win / live-lose / won / lost / void
function betState(b, F=S.fixtures, live=true){
  const f=F[b.e]; if(!f) return 'open';
  if(f.st==='postp') return 'void';
  if(f.st==='finished') return legWins(f,b)?'won':'lost';
  if(f.st==='live' && live) return legWins(f,b)?'live-win':'live-lose';
  return 'open';
}
// חשבון שחקן: יתרה זמינה, שווי חי, רווח שבועי
function account(p, F=S.fixtures, wk=null){
  const bets=Object.values(p.bets||{});
  let avail = START_COINS + WEEKLY_BONUS*bonusWeeks(p.joined), value, open=0, won=0, settled=0, wkProfit=0, wkBets=0;
  value = avail;
  bets.forEach(b=>{
    avail -= b.s; value -= b.s;
    const st=betState(b,F,true), stSettled=betState(b,F,false);
    if(stSettled==='won'){ avail += payout(b); } else if(stSettled==='void'){ avail += b.s; }
    const v = st==='won'||st==='live-win' ? payout(b) : st==='lost'||st==='live-lose' ? 0 : b.s;
    value += v;
    if(st==='open'||st.startsWith('live')) open++;
    if(st==='won'||st==='lost'){ settled++; if(st==='won') won++; }
    const f=F[b.e];
    if(wk && f && weekKey(dayKey(f.ko))===wk){ wkBets++; wkProfit += (st==='open'||st==='void') ? 0 : v - b.s; }
  });
  return {avail, value, open, won, settled, wkProfit, wkBets, n:bets.length};
}
function standings(mode, F=S.fixtures){
  const wk = weekKey(dayKey(Date.now()));
  const rows = Object.entries(S.players).filter(([k,p])=>p&&p.name).map(([k,p])=>({k, name:p.name, ...account(p,F,wk)}));
  const key = r => mode==='week' ? r.wkProfit : r.value;
  rows.sort((a,b)=> key(b)-key(a) || b.won-a.won || a.name.localeCompare(b.name,'he'));
  rows.forEach((r,i)=>{ const p=rows[i-1]; r.rank = p && key(p)===key(r) ? p.rank : i+1; });
  return rows;
}
function prevFixtures(){ const pr=S.meta.prev; if(!pr||!pr.r) return null; const F={...S.fixtures}; for(const id in pr.r) if(F[id]) F[id]={...F[id], ...pr.r[id]}; return F; }
function rankMap(mode,F){ const m={}; standings(mode,F).forEach(r=>m[r.k]=r.rank); return m; }
// קופת הבנק: גדלה כשמפסידים, מתרוקנת כשזוכים (כולל לייב)
function bank(F=S.fixtures){
  let b=BANK_START;
  Object.values(S.players).forEach(p=>{ if(p&&p.name) b -= WEEKLY_BONUS*bonusWeeks(p.joined); });   // המענק השבועי יוצא מהקופה
  Object.values(S.players).forEach(p=>Object.values(p.bets||{}).forEach(x=>{ const st=betState(x,F,true);
    if(st==='lost'||st==='live-lose') b+=x.s; else if(st==='won'||st==='live-win') b-=payout(x)-x.s; }));
  return b;
}
const jokerUsed = (p, dk) => Object.values((p&&p.bets)||{}).some(b=>b.j && S.fixtures[b.e] && dayKey(S.fixtures[b.e].ko)===dk);

// ================= רינדור =================
function ad(){ adIdx=(adIdx+1)%ADS.length; return `<div class="ad">📢 ${ADS[adIdx]}</div>`; }
function liveTag(f){ const m=(f.min||'').trim(); const t=!m?'':m==='HT'?' · מחצית':` · <bdi dir="ltr">${esc(m.replace(/'$/,''))}'</bdi>`; return `<span class="live">חי${t}</span>`; }
function renderTop(){
  const p=myP(), a=p?account(p):null;
  document.getElementById('top').innerHTML = `
    <span class="pill"><span class="dot ${connected?'on':''}"></span>${connected?'חי':'מתחבר…'}</span>
    ${a?`<span class="bal" onclick="go('mine')">🪙 ${fmt(a.avail)} <small>זמין</small></span>`:''}
    <span class="pill" onclick="go('table')">🏦 ${fmt(bank())}</span>`;
}
function fxCard(f){
  const L=isLocked(f), p=myP(), mine=Object.entries((p&&p.bets)||{}).filter(([id,b])=>b.e===f.id);
  const o=f.odds||{}, lg=LEAGUES[f.lg]||{};
  const mid = f.st==='live'||f.st==='finished' ? `<div class="score">${f.h} - ${f.a}</div>${f.st==='live'?liveTag(f):'<span class="fin">הסתיים</span>'}`
            : f.st==='postp' ? '<span class="fin">נדחה</span>' : `<div class="ko">${hm(f.ko)}</div>`;
  const cd = f.ko - LOCK_BEFORE_MS - Date.now();
  const lockTxt = f.st!=='none' ? '' : cd<=0 ? '<span class="lock">🔒 ננעל</span>' : cd<3600e3 ? `<span class="lock">ננעל בעוד ${Math.ceil(cd/60e3)} דק'</span>` : '';
  const ob = (k,lab) => { const has=mine.some(([id,b])=>b.m==='W'&&b.p===k);
    return `<button class="ob ${has?'mine':''}" ${L||!o[k]?'disabled':''} onclick="openBet('${f.id}','W','${k}')"><span class="l">${lab}</span><span class="v">${o[k]?o[k].toFixed(2):'–'}</span></button>`; };
  let h = `<div class="card fx"><div class="top"><span>${lg.f||''} ${lg.n||''}</span><span>${lockTxt}</span></div>
    <div class="teams"><div class="tm">${logo(f.hi)}${esc(he(f.home))}</div><div class="mid">${mid}</div><div class="tm">${logo(f.ai)}${esc(he(f.away))}</div></div>`;
  if(f.st==='none') h += `<div class="odds">${ob('1',esc(he(f.home)))}${ob('X','תיקו')}${ob('2',esc(he(f.away)))}</div>
      <button class="csb" ${L||!o.cs?'disabled':''} onclick="openBet('${f.id}','CS','1-0')">🎯 הימור על תוצאה מדויקת</button>`;
  mine.forEach(([id,b])=>{ const st=betState(b); const cls=st==='won'||st==='live-win'?'won':st==='lost'||st==='live-lose'?'lost':'';
    h += `<div class="mybet ${cls}"><span>${b.j?'🃏 ':''}${esc(pickLabel(f,b))} · ${fmt(b.s)} 🪙 × ${b.o.toFixed(2)}</span><span>${stText(st,b)}</span></div>`;
    if(!L) h += `<div style="text-align:left;margin-top:2px"><a href="#" class="muted" onclick="cancelBet('${id}');return false">בטל הימור</a></div>`; });
  // מי הימר מה – נחשף רק אחרי הנעילה
  const all=[]; Object.values(S.players).forEach(pl=>Object.values(pl.bets||{}).forEach(b=>{ if(b.e===f.id) all.push({n:pl.name,b}); }));
  if(all.length) h += L ? `<details class="who"><summary>👀 ${all.length} הימורים על המשחק – מי הימר מה</summary>${all.map(({n,b})=>{const st=betState(b);
      return `<div class="wr"><span>${b.j?'🃏 ':''}${esc(n)}</span><span>${esc(pickLabel(f,b))} · ${fmt(b.s)} <span class="st-${st.startsWith('live')?'live':st==='void'?'open':st}">${stText(st,b)}</span></span></div>`}).join('')}</details>`
    : `<div class="muted" style="margin-top:8px">🎰 ${all.length} הימורים על המשחק · ייחשפו בנעילה</div>`;
  return h + `</div>`;
}
function stText(st,b){ return st==='won'?`✅ +${fmt(payout(b)-b.s)}`:st==='lost'?'❌ הפסד':st==='live-win'?'🟢 כרגע זוכה':st==='live-lose'?'🔴 כרגע מפסיד':st==='void'?'↩️ הוחזר':'⏳ פתוח'; }

function viewGames(){
  const now=Date.now(), today=dayKey(now);
  const list=fxList().filter(f=>dayKey(f.ko)>=addDays(today,-1)).sort((a,b)=>a.ko-b.ko);
  const days=[...new Set(list.map(f=>dayKey(f.ko)))];
  const liveN=list.filter(f=>f.st==='live').length;
  if(!dayF || (dayF!=='live' && !days.includes(dayF))) dayF = liveN ? 'live' : (days.find(d=>d>=today) || days[days.length-1]);
  let h = `<div class="chips">${liveN?`<button class="chip ${dayF==='live'?'on':''}" onclick="dayF='live';render()">🔴 חי עכשיו<span class="n">${liveN}</span></button>`:''}
    ${days.map(d=>`<button class="chip ${dayF===d?'on':''}" onclick="dayF='${d}';render()">${dayLabel(d)}<span class="n">${list.filter(f=>dayKey(f.ko)===d).length}</span></button>`).join('')}</div>`;
  const shown = list.filter(f=> dayF==='live' ? f.st==='live' : dayKey(f.ko)===dayF);
  if(!shown.length) return h + `<div class="empty"><div class="e">📅</div>אין משחקים ביום הזה.<br>הרובוט מעדכן משחקים ל-3 ימים קדימה.</div>` + ad();
  const p=myP();
  if(dayF!=='live' && p && !jokerUsed(p,dayF) && shown.some(f=>!isLocked(f))) h += `<div class="muted" style="margin:4px 2px">🃏 הג'וקר היומי שלך פנוי – בחר הימור אחד היום עם רווח כפול</div>`;
  const ord = f => f.st==='live'?0 : f.st==='none'?1 : 2;   // חי ← עתידי ← הסתיים
  Object.keys(LEAGUES).forEach((lg,i)=>{ const g=shown.filter(f=>f.lg===lg).sort((a,b)=>ord(a)-ord(b)||a.ko-b.ko); if(!g.length) return;
    h += `<div class="lghead">${LEAGUES[lg].f} ${LEAGUES[lg].n}</div>` + g.map(fxCard).join('');
    if(i===1) h += ad(); });
  return h + ad();
}

  const p=myP(); if(!p) return '';
  const a=account(p), bets=Object.entries(p.bets||{}).map(([id,b])=>({id,...b,f:S.fixtures[b.e]})).sort((x,y)=>(y.f?y.f.ko:0)-(x.f?x.f.ko:0));
  const open=bets.filter(b=>{const s=betState(b);return s==='open'||s.startsWith('live')}), done=bets.filter(b=>!open.includes(b));
  let h = `<h2>🧾 ההימורים של ${esc(me)}</h2>
    <div class="sum"><div><b>${fmt(a.avail)}</b><span>🪙 זמין להימור</span></div><div><b>${fmt(a.value)}</b><span>💼 שווי כולל (חי)</span></div><div><b>${a.won}/${a.settled}</b><span>✅ הימורים שזכו</span></div></div>

  if(a.avail<=0 && !open.length) h += `<div class="card" style="text-align:center">😵 פשטת רגל! ביום שלישי תקבל ${WEEKLY_BONUS} ז'יטונים.<br>בינתיים – <b>20 ברפיז ב-BUX</b></div>`;
  const row = b => { const st=betState(b), f=b.f; const cls=st==='won'||st==='live-win'?'won':st==='lost'||st==='live-lose'?'lost':'';
    return `<div class="card" style="padding:10px"><div class="muted">${f?`${LEAGUES[f.lg]?.f||''} ${dayLabel(dayKey(f.ko))} ${hm(f.ko)} · ${esc(he(f.home))} – ${esc(he(f.away))}`:'משחק'}
      ${f&&(f.st==='live'||f.st==='finished')?` · <b style="color:#fff;direction:ltr;unicode-bidi:isolate">${f.h}-${f.a}</b> ${f.st==='live'?liveTag(f):''}`:''}</div>
      <div class="mybet ${cls}"><span>${b.j?'🃏 ':''}${esc(pickLabel(f,b))} · ${fmt(b.s)} 🪙 × ${b.o.toFixed(2)} = ${fmt(payout(b))}</span><span>${stText(st,b)}</span></div>
      ${f&&!isLocked(f)?`<div style="text-align:left;margin-top:4px"><a href="#" class="muted" onclick="cancelBet('${b.id}');return false">בטל הימור</a></div>`:''}</div>`; };
  h += `<h2>⏳ פתוחים (${open.length})</h2>` + (open.length?open.map(row).join(''):`<div class="empty"><div class="e">🎰</div>אין הימורים פתוחים. <a href="#" style="color:var(--y)" onclick="go('games');return false">ללוח המשחקים</a></div>`);
  h += ad() + `<h2>📜 היסטוריה (${done.length})</h2>` + done.slice(0,40).map(row).join('');
  return h + `<footer>מחובר כ-${esc(me)} · <a href="#" onclick="logout();return false">החלף משתמש</a></footer>`;
}

    h += `<tr class="${me&&r.k===keyOf(me)?'me':''}"><td class="big">${king?'👑':r.rank}</td>
      <td class="n">${esc(r.name)}${arr}${king?`<span class="tag k">${mode==='week'?'👑 אלוף BUX של השבוע':"👑 מלך הז'יטונים"}</span>`:''}${pen?`<span class="tag ${pi===0?'l':'p'}">${pen}</span>`:''}</td>
      <td class="big">${val}</td><td>${mode==='week'?r.wkBets:`${r.won}/${r.settled}`}</td></tr>`;
  });
  h += `</tbody></table></div>`;
  if(mode==='week') h += `<button class="btn sec" onclick="showPodium(addDays(weekKey(dayKey(Date.now())),-7))">🏆 הפודיום של שבוע שעבר</button>`;
  return h + ad();
}
function setTM(m){ tblMode=m; lsSet('bb_tm',m); render(); }

function liveTable(lg){
  const base=(S.tables[lg]&&S.tables[lg].rows)||[];
  const rows=base.map((r,i)=>({...r, base:i+1, live:null}));
  const by=Object.fromEntries(rows.map(r=>[r.t,r]));
  fxList().filter(f=>f.lg===lg && (f.st==='live' || (f.st==='finished' && !f.inT && f.bh!=null))).forEach(f=>{
    const H=by[f.home], A=by[f.away]; if(!H||!A) return;
    [[H,f.h,f.a],[A,f.a,f.h]].forEach(([t,gf,ga])=>{ t.pld++; t.gf+=gf; t.ga+=ga; if(gf>ga){t.w++;t.pts+=3} else if(gf===ga){t.d++;t.pts++} else t.l++;
      if(f.st==='live') t.live=`${f.h}-${f.a}`; });
  });
  rows.sort((a,b)=>b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
  return rows;
}
function viewLeagues(){
  let h = `<div class="chips">${Object.entries(LEAGUES).map(([k,l])=>`<button class="chip ${lgF===k?'on':''}" onclick="lgF='${k}';lsSet('bb_lg','${k}');render()">${l.f} ${l.n}</button>`).join('')}</div>`;
  const rows=liveTable(lgF);
  if(!rows.length) return h + `<div class="empty"><div class="e">📊</div>הטבלה תופיע ברגע שהרובוט יביא אותה</div>`;
  const anyLive=rows.some(r=>r.live);
  h += `<div class="muted">${anyLive?'🔴 טבלה חיה – כולל המשחקים שרצים עכשיו':'מתעדכן אוטומטית אחרי כל מחזור'}</div>
    <div class="card lt" style="padding:4px 6px"><table><thead><tr><th>#</th><th style="text-align:right">קבוצה</th><th>מש'</th><th>נ-ת-ה</th><th>הפרש</th><th>נק'</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{ const d=r.base-(i+1), arr=d>0?`<span class="arr up">▲${d}</span>`:d<0?`<span class="arr dn">▼${-d}</span>`:'';
    h += `<tr class="${r.live?'lv':''}"><td>${i+1}</td><td class="n">${logo(r.img)}<span>${esc(he(r.t))}${arr}${r.live?` <span class="live" style="direction:ltr;unicode-bidi:isolate">${r.live}</span>`:''}</span></td>
      <td>${r.pld}</td><td style="font-size:12px">${r.w}-${r.d}-${r.l}</td><td style="direction:ltr;unicode-bidi:isolate">${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</td><td class="big">${r.pts}</td></tr>`; });
  return h + `</tbody></table></div>` + ad();
}

async function login(){
  const v=(document.getElementById('nameIn').value||'').trim().replace(/\s+/g,' '), err=document.getElementById('loginErr');
  if(v.length<2){ err.textContent='צריך לפחות 2 אותיות 🙂'; return; }
  if(firstLoad||!MYHASH){ err.textContent='רגע, מתחבר… נסה שוב בעוד שנייה'; return; }
  const k=keyOf(v), ex=S.players[k];
  if(ex && !isMine(ex)){ err.innerHTML='השם הזה כבר תפוס, נסה כינוי אחר<div class="muted" style="font-weight:400;margin-top:4px">זה אתה מטלפון או דפדפן אחר? בקש מהמנהל ללחוץ "שחרר" ליד השם שלך</div>'; return; }
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='נכנס...';
  if(!ex || !ex.owner){
    const ok=await save(ex?'PATCH':'PUT','players/'+k, ex?{owner:MYHASH}:{name:v,owner:MYHASH,joined:Date.now()}, null);

  render();
}
function logout(){ if(!confirm('להתנתק מהמכשיר?')) return; me=null; lsSet('bb_name',null); render(); }

// ================= גיליון הימור =================
function openBet(eid, m, p){
  const f=S.fixtures[eid]; if(!f||isLocked(f)) return toast('המשחק ננעל 🔒',false,'err');
  if(!me) return toast('קודם נכנסים עם שם 🙂');
  const pl=myP(), a=account(pl);
  sheetSt={eid, m, p, s: Math.min(a.avail, Math.max(10, Math.round(a.avail/10/5)*5)) , j:false};
  if(m==='CS'){ const [h,x]=p.split('-').map(Number); sheetSt.ch=h; sheetSt.ca=x; }
  renderSheet(); document.getElementById('sheet').classList.add('show'); document.getElementById('sheetBg').classList.add('show');
}
function closeSheet(){ sheetSt=null; document.getElementById('sheet').classList.remove('show'); document.getElementById('sheetBg').classList.remove('show'); }
function sheetOdds(){ const f=S.fixtures[sheetSt.eid], o=(f&&f.odds)||{}; return sheetSt.m==='CS' ? (o.cs||{})[`${sheetSt.ch}-${sheetSt.ca}`] : o[sheetSt.p]; }
function renderSheet(){
  if(!sheetSt) return; const f=S.fixtures[sheetSt.eid]; if(!f) return closeSheet();
  const L=isLocked(f), pl=myP(), a=account(pl), dk=dayKey(f.ko), jkFree=!jokerUsed(pl,dk);
  if(sheetSt.m==='CS') sheetSt.p=`${sheetSt.ch}-${sheetSt.ca}`;
  const o=sheetOdds(), s=Math.max(0,Math.floor(sheetSt.s||0)), win=o? (sheetSt.j? s+2*(s*o-s) : s*o) : 0;
  let h = `<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">🎰 הימור חדש</b><button class="x" style="border-color:#555;color:#ccc" onclick="closeSheet()">✕</button></div>
    <div class="muted" style="margin:4px 0 10px">${LEAGUES[f.lg]?.f||''} ${esc(he(f.home))} – ${esc(he(f.away))} · ${dayLabel(dk)} ${hm(f.ko)}</div>`;
  if(sheetSt.m==='CS'){
    h += `<div class="pick"><div class="muted">🎯 תוצאה מדויקת</div>
      <div class="csgrid"><div><div style="font-weight:900;font-size:13px;margin-bottom:6px">${esc(he(f.home))}</div><div class="step"><button class="minus" onclick="csB('ch',-1)">−</button><span class="val">${sheetSt.ch}</span><button class="plus" onclick="csB('ch',1)">+</button></div></div>
      <div style="font-weight:900;color:var(--o)">:</div>
      <div><div style="font-weight:900;font-size:13px;margin-bottom:6px">${esc(he(f.away))}</div><div class="step"><button class="minus" onclick="csB('ca',-1)">−</button><span class="val">${sheetSt.ca}</span><button class="plus" onclick="csB('ca',1)">+</button></div></div></div>
      <div class="o" style="margin-top:8px">${o?'× '+o.toFixed(2):'–'}</div></div>`;
  } else {
    h += `<div class="pick"><div class="t">${esc(pickLabel(f,{m:'W',p:sheetSt.p}))}</div><div class="o">× ${o?o.toFixed(2):'–'}</div></div>`;
  }
  h += `<div class="stake"><input id="stakeIn" type="number" inputmode="numeric" min="1" value="${s||''}" oninput="sheetSt.s=+this.value;updWin()"><span style="font-weight:900">🪙</span></div>
    <div class="qs">${[10,25,50,100].map(v=>`<button onclick="setStake(${v})">${v}</button>`).join('')}<button onclick="setStake(${Math.floor(a.avail)})">הכול</button></div>
    <div class="muted" style="text-align:center;margin-top:6px">זמין: ${fmt(a.avail)} 🪙</div>
    ${jkFree?`<div class="jk ${sheetSt.j?'on':''}" onclick="sheetSt.j=!sheetSt.j;renderSheet()"><span>🃏 ג'וקר יומי – הרווח כפול!<br><small style="opacity:.8">פעם אחת ל${dayLabel(dk)}</small></span><span class="sw"></span></div>`:`<div class="muted" style="text-align:center;margin:8px 0">🃏 כבר השתמשת בג'וקר של ${dayLabel(dk)}</div>`}
    <div class="win" id="winTxt">זכייה אפשרית: <b>${fmt(win)} 🪙</b></div>
    <button class="btn" id="betBtn" ${L||!o?'disabled':''} onclick="placeBet()">${L?'🔒 ננעל':'הימור! 🎰'}</button>
    <div class="muted" style="text-align:center;margin-top:8px">אפשר לבטל עד הנעילה (2 דק' לפני המשחק)</div>`;
  const sh=document.getElementById('sheet'), focused=document.activeElement&&document.activeElement.id==='stakeIn';
  sh.innerHTML=h; if(focused){ const i=document.getElementById('stakeIn'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
}
function updWin(){ const o=sheetOdds(), s=Math.max(0,Math.floor(sheetSt.s||0)); document.getElementById('winTxt').innerHTML=`זכייה אפשרית: <b>${fmt(o?(sheetSt.j?s+2*(s*o-s):s*o):0)} 🪙</b>`; }
function setStake(v){ sheetSt.s=Math.max(0,v); renderSheet(); }
function csB(k,d){ sheetSt[k]=Math.max(0,Math.min(4,sheetSt[k]+d)); renderSheet(); }
async function placeBet(){
  const f=S.fixtures[sheetSt.eid], pl=myP(); if(!f||isLocked(f)) return toast('המשחק ננעל 🔒',false,'err');
  if(!isMine(pl)) return toast('השם הזה שייך למכשיר אחר 🙅',false,'err');
  const s=Math.floor(sheetSt.s||0), o=sheetOdds(), a=account(pl);
  if(!o) return toast('אין יחס לבחירה הזו',false,'err');
  if(s<1) return toast('כמה ז\'יטונים? 🙂',false,'err');
  if(s>a.avail) return toast(`אין מספיק ז'יטונים – זמין ${fmt(a.avail)}`,false,'err');
  if(sheetSt.j && jokerUsed(pl,dayKey(f.ko))) sheetSt.j=false;
  const bid='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const bet={e:sheetSt.eid, m:sheetSt.m, p:sheetSt.p, s, o, at:Date.now()}; if(sheetSt.j) bet.j=true;
  const btn=document.getElementById('betBtn'); btn.disabled=true; btn.textContent='שולח...';
  if(await save('PUT',`players/${keyOf(me)}/bets/${bid}`, bet, 'ההימור נקלט! ✅ בהצלחה 🍀')){ closeSheet(); confetti(60); }
  else { btn.disabled=false; btn.textContent='הימור! 🎰'; }
}
async function cancelBet(bid){
  const pl=myP(), b=pl&&pl.bets&&pl.bets[bid]; if(!b) return;
  if(isLocked(S.fixtures[b.e])) return toast('המשחק ננעל – אי אפשר לבטל 🔒',false,'err');
  if(!confirm(`לבטל את ההימור (${fmt(b.s)} ז'יטונים יחזרו אליך)?`)) return;
  await save('DELETE',`players/${keyOf(me)}/bets/${bid}`, undefined, 'ההימור בוטל ↩️');
}

async function releaseP(k){ if(!confirm('לשחרר את '+S.players[k].name+'? הוא יוכל להיכנס שוב מטלפון אחר, וההימורים נשמרים')) return; await save('DELETE','players/'+k+'/owner',undefined,'שוחרר ✅'); }
async function delP(k){ if(!confirm('למחוק את '+S.players[k].name+' וכל ההימורים שלו?')) return; await save('DELETE','players/'+k,undefined,'נמחק 🗑️'); }
function adminLogin(){ const pin=prompt('קוד מנהל:'); if(pin===null) return; if(pin===ADMIN_PIN){ isAdmin=true; sessionSet('bb_admin','1'); go('admin'); } else toast('קוד שגוי 🙅',false,'err'); }

// ================= ניווט =================
function renderNav(){
  const p=myP(), openN=p?account(p).open:0;
  const tabs=[['games','🎰','משחקים'],['mine','🧾','ההימורים שלי'],['table','🏆','טבלה'],['leagues','📊','ליגות']].filter(t=>me||t[0]!=='mine');

function go(k){ tab=k; lsSet('bb_tab',k); render(); window.scrollTo(0,0); }

}
const adminLink = () => isAdmin?'':`<footer><a href="#" onclick="adminLogin();return false">⚙️ כניסת מנהל</a> · מופעל ע"י CrossFit BUX 🏋️<br>משחק לשם הכיף בלבד · אין כסף אמיתי ואין אפשרות לקנות ז'יטונים</footer>`;

// ================= באנר גול =================
function detectGoals(){
  const now={}; fxList().forEach(f=>{ if(f.st==='live'||f.st==='finished') now[f.id]=(f.h|0)+(f.a|0); });
  if(seenGoals) for(const id in now) if(seenGoals[id]!==undefined && now[id]>seenGoals[id]) showGoal(S.fixtures[id]);
  seenGoals=now;
}
function showGoal(f){
  const F0=prevFixtures(), prev=F0?rankMap('week',F0):{}, up=standings('week').filter(r=>prev[r.k]!=null&&prev[r.k]>r.rank).length;
  const p=myP(), mineOn=p&&Object.values(p.bets||{}).some(b=>b.e===f.id);
  const el=document.getElementById('goalbar');
  el.innerHTML=`<span class="bg">⚽ גול!</span>${LEAGUES[f.lg]?.f||''} ${esc(he(f.home))} <bdi dir="ltr">${f.h}–${f.a}</bdi> ${esc(he(f.away))}${up?` · ${up} עלו בטבלה`:''}${mineOn?'<br>💰 יש לך הימור על המשחק הזה!':''}`;
  el.classList.add('show'); try{ navigator.vibrate&&navigator.vibrate([120,60,120]) }catch(e){}
  clearTimeout(goalTimer); goalTimer=setTimeout(()=>el.classList.remove('show'),6000);
}

// ================= פודיום שבועי + קונפטי =================
function showPodium(wk){
  const F=S.fixtures, rows=Object.entries(S.players).filter(([k,p])=>p&&p.name).map(([k,p])=>({name:p.name,...account(p,F,wk)})).filter(r=>r.wkBets>0).sort((a,b)=>b.wkProfit-a.wkProfit);
  if(!rows.length) return toast('לא היו הימורים בשבוע הזה');
  const top=[rows[1],rows[0],rows[2]], cls=['p2','p1','p3'], med=['🥈','🥇','🥉'];
  document.getElementById('final').innerHTML=`<h1>🏁 סיכום שבוע ${weekLabel(wk)}</h1><div class="muted">הרווחים הגדולים של השבוע</div>
    <div class="podium">${top.map((r,i)=>r?`<div class="pod ${cls[i]}"><div class="who2">${i===1?'👑 ':''}${esc(r.name)}</div><div class="blk">${med[i]}<small>${sgn(r.wkProfit)} 🪙</small></div></div>`:'<div class="pod"></div>').join('')}</div>
    <div style="font-weight:900;color:var(--y)">👑 ${esc(rows[0].name)} – אלוף BUX של השבוע!</div>
    <div style="font-weight:900;font-size:19px;margin:14px 0 22px">נתראה באימון – CrossFit BUX יהוד 🏋️</div>
    <button class="btn" style="max-width:300px" onclick="document.getElementById('final').classList.remove('show')">סגור</button>`;
  document.getElementById('final').classList.add('show'); confetti();
}
function afterFirstLoad(){   // פעם בשבוע: פודיום של השבוע שהסתיים
  const last=addDays(weekKey(dayKey(Date.now())),-7);
  if(me && lsGet('bb_pod')!==last){ lsSet('bb_pod',last); const any=Object.values(S.players).some(p=>Object.values(p.bets||{}).some(b=>S.fixtures[b.e]&&weekKey(dayKey(S.fixtures[b.e].ko))===last)); if(any) setTimeout(()=>showPodium(last),800); }
}
function confetti(n=180){
  const c=document.getElementById('conf'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#FFD000','#FF6B00','#fff','#22c55e','#ff3d7f'];
  const ps=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,r:4+Math.random()*6,c:cols[Math.random()*5|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6,va:-.2+Math.random()*.4}));
  const t0=Date.now();
  (function f(){ x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.y+=p.vy; p.x+=p.vx; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if(Date.now()-t0<4500) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
function toast(msg,big,kind,ms=2400){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'+(kind==='err'?' err':'')+(big?' big':''); t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},ms);
}

setInterval(()=>{ if(tab==='games' && !sheetSt && !document.querySelector('details[open]')) render(); }, 30000);   // ספירה לאחור לנעילה

if(/[?&]admin=1/.test(location.search) || /\/admin\/?$/.test(location.pathname)){ if(isAdmin) go('admin'); else setTimeout(adminLogin,400); }
