name: בדיקות ועלייה לאוויר
# כל שינוי עולה לאתר האמיתי רק אם כל הבדיקות עברו בסביבת הבדיקה
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }     # כל הצעת שינוי (מהסשנים) נבדקת לפני מיזוג
  schedule: [ { cron: '30 0 * * *' } ]      # כל לילה: כל ההתקפות מחדש על סביבת הבדיקה
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: https://betit-staging-default-rtdb.europe-west1.firebasedatabase.app
      FIREBASE_SA: ${{ secrets.STAGING_SA }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-auth requests playwright && python3 -m playwright install --with-deps chromium > /dev/null
      - name: בדיקות יחידה לרובוט (נתונים שבורים, עיגול, שעון חורף, שחזור)
        run: python3 tests/robot_unit_test.py
      - name: חוקי אבטחה לסביבת הבדיקה
        run: python3 ops/deploy_rules.py
      - name: בדיקת חדירה (ניסיונות רמאות)
        run: python3 tests/security_test.py
      - name: סגירת הימורים, טבלאות ושחזור חשבון
        run: python3 tests/settlement_test.py
      - name: מראה חיה של הרובוט (סקייל) – זהה לשרת אחרי כל כתיבה
        run: python3 tests/mirror_test.py
      - name: המפגש השבועי מקצה לקצה (פתיחה, הימורים, סגירה, פודיום, טבלה מצטברת, פידבק)
        run: python3 tests/meetup_test.py
      - name: דפדפן אמיתי – כניסה, הימור, רענון, ביטול
        run: python3 tests/smoke_test.py
  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'   # עולה לאוויר רק ממיזוג ל-master
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write, contents: read }
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-auth requests
      - name: חוקי אבטחה לאתר האמיתי
        run: python3 ops/deploy_rules.py
        env:
          DB_URL: https://buxbet-il-default-rtdb.europe-west1.firebasedatabase.app
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
      - run: mkdir _site && cp -r index.html admin og.png icons manifest.webmanifest sw.js _site/
      - name: עלייה לאוויר – bet-it.web.app
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          echo "$FIREBASE_SA" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx -y firebase-tools@15 deploy --only hosting --project buxbet-il --non-interactive
          rm -f /tmp/sa.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
