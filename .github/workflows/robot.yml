name: רובוט BUX BET
on:
  schedule:
    - cron: '*/10 * * * *'    # מתחיל מחדש אוטומטית אם הריצה הקודמת הסתיימה
  workflow_dispatch:
concurrency:
  group: bux-bet-robot
  cancel-in-progress: false
permissions:
  contents: read
  actions: write          # כדי שהרובוט יפעיל את הגיבוי כל שעה בעצמו
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-auth requests
      - run: python3 robot.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
